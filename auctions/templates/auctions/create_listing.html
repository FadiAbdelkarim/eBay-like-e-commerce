{% extends "auctions/layout.html" %}

{% block title %}Create Listing{% endblock %}

{% block body %}
    <h2>Create a New Listing</h2>

    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="title">Title</label>
        <input type="text" name="title" id="title" placeholder="Listing title">

        <label for="description">Description</label>
        <textarea name="description" id="description" placeholder="Describe the item"></textarea>

        <label for="starting_bid">Starting Bid ($)</label>
        <input type="number" step="0.01" name="starting_bid" id="starting_bid" placeholder="0.00">

        <label for="image_url">Image URL (optional)</label>
        <input type="url" name="image_url" id="image_url" placeholder="https://...">

        <label for="category">Category (optional)</label>
        <select name="category" id="category">
            <option value="">-- No category --</option>
            {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>

        <br><br>
        <button type="submit">Create Listing</button>
    </form>
{% endblock %}
