{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{% block title %}Commerce{% endblock %}</title>
        <link href="{% static 'auctions/styles.css' %}" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar-brand">🏷️ Commerce</div>
            <ul class="nav">
                <li><a class="nav-link" href="{% url 'index' %}">Active Listings</a></li>
                <li><a class="nav-link" href="{% url 'categories' %}">Categories</a></li>
                {% if user.is_authenticated %}
                    <li><a class="nav-link" href="{% url 'watchlist_page' %}">Watchlist</a></li>
                    <li><a class="nav-link" href="{% url 'create_listing' %}">Create Listing</a></li>
                    <li><a class="nav-link" href="{% url 'logout' %}">Log Out ({{ user.username }})</a></li>
                {% else %}
                    <li><a class="nav-link" href="{% url 'login' %}">Log In</a></li>
                    <li><a class="nav-link" href="{% url 'register' %}">Register</a></li>
                {% endif %}
            </ul>
        </nav>
        <div class="container">
            {% block body %}{% endblock %}
        </div>
    </body>
</html>
